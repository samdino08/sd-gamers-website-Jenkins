<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Games</title>
  <meta name="description" content="Multiplayer PS4 games to play with your squad.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="games" data-title="Games">
  <header id="site-header" class="site-header"></header>

  <main id="main">
    <section class="page-head container">
      <h1>Multiplayer games on PS4</h1>
      <p class="lead">FIFA 24 is our home ground, but the squad plays plenty more. Pick a game and schedule a night for it.</p>
      <div class="chips" id="game-filters" role="group" aria-label="Filter games by type"></div>
    </section>
    <section class="container section-tight">
      <div class="game-grid" id="game-grid"></div>
      <p class="hint note">Player counts and modes are summaries and can change with updates. Check the PlayStation Store for current details. Some games need PlayStation Plus for online play.</p>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/games.js"></script>
</body>
</html>
